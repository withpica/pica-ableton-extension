<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --bg:#0A0A0A; --line:rgba(255,255,255,.10); --fg:#EDEDED; --muted:rgba(255,255,255,.45); --copper:#B87333; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; padding:16px; }
      h1 { font-size:14px; font-weight:400; letter-spacing:.04em; margin:0 0 4px; }
      .hint { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; margin-bottom:12px; }
      #rows { max-height:300px; overflow-y:auto; }
      .writer-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
      .writer-row input { background:transparent; border:1px solid var(--line); color:var(--fg); padding:6px 8px; font:12px ui-monospace,Menlo,monospace; flex:1; }
      .writer-row input:focus { outline:none; border-color:var(--copper); }
      .writer-row .remove { background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:0 2px; }
      .add { background:transparent; border:1px dashed var(--line); color:var(--muted); width:100%; padding:7px; cursor:pointer; font-size:12px; margin-top:2px; }
      .actions { display:flex; gap:8px; margin-top:16px; }
      .actions button { flex:1; padding:9px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; font-size:12px; letter-spacing:.04em; }
      .actions button.primary { border-color:var(--copper); color:var(--copper); }
    </style>
  </head>
  <body>
    <h1>who wrote this?</h1>
    <div class="hint">list the songwriters. leave blank to skip.</div>
    <div id="rows"></div>
    <button class="add" id="add">+ add writer</button>
    <div class="actions">
      <button id="skip">skip — do later</button>
      <button id="save" class="primary">save writers</button>
    </div>

    <script>
      var rowsEl = document.getElementById("rows");

      function addRow(name) {
        var div = document.createElement("div");
        div.className = "writer-row";
        var inp = document.createElement("input");
        inp.placeholder = "songwriter name";
        inp.value = name || "";
        var rm = document.createElement("button");
        rm.className = "remove";
        rm.textContent = "×";
        rm.title = "remove row";
        rm.addEventListener("click", function () { div.remove(); });
        div.appendChild(inp);
        div.appendChild(rm);
        rowsEl.appendChild(div);
      }

      addRow("");
      addRow("");

      document.getElementById("add").addEventListener("click", function () { addRow(""); });

      function post(resultObj) {
        var msg = { method: "close_and_send", params: [JSON.stringify(resultObj)] };
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live) {
          window.webkit.messageHandlers.live.postMessage(msg); // macOS
        } else if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(msg); // Windows
        }
      }

      document.getElementById("skip").addEventListener("click", function () {
        post({ cancelled: true });
      });
      document.getElementById("save").addEventListener("click", function () {
        var names = [];
        rowsEl.querySelectorAll(".writer-row input").forEach(function (inp) {
          var v = inp.value.trim();
          if (v) names.push(v);
        });
        post({ names: names });
      });
    </script>
  </body>
</html>
