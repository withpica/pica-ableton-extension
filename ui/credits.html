<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div class="h">who played what?</div>
    <div class="hint" id="hint">instrument is a suggestion from the track name, edit freely. leave a row's name blank to skip it.</div>
    <div id="rows"></div>
    <datalist id="people"></datalist>
    <button class="add" id="add">+ add a part</button>
    <div class="actions">
      <button id="skip">skip, do later</button>
      <button id="save" class="primary">save credits</button>
    </div>

    <script>
      // Injected by extension.ts. Shape: { tree: [PrefillNode] }, where a node is
      // { key, instrument, performerName, kind, expanded, children? }.
      var prefill = window.__PICA_PREFILL__ || {};
      if (!window.__PICA_PREFILL__) {
        try { prefill = JSON.parse(decodeURIComponent(location.hash.slice(1) || "")) || {}; } catch (e) {}
      }
      var rowsEl = document.getElementById("rows");
      var peopleNames = window.__PICA_PEOPLE_NAMES__ || [];
      var dl = document.getElementById("people");
      peopleNames.forEach(function (n) {
        var o = document.createElement("option");
        o.value = n;
        dl.appendChild(o);
      });

      function makeInput(cls, ph, val) {
        var el = document.createElement("input");
        el.className = cls;
        el.placeholder = ph;
        el.value = val || "";
        return el;
      }

      // Render one node (and, for a group, its children) into `container`.
      function renderNode(node, container, depth) {
        var isGroup = node.kind === "group";
        var wrap = document.createElement("div");
        wrap.className = "node";
        wrap.dataset.kind = node.kind;

        var row = document.createElement("div");
        row.className = "credit-row";
        row.style.paddingLeft = depth * 16 + "px";

        var caret = document.createElement("button");
        caret.type = "button";
        caret.className = isGroup ? "caret" : "caret leaf";

        var inst = makeInput("instrument", "instrument", node.instrument);
        var who = makeInput("who", "who played this?", node.performerName);
        who.setAttribute("list", "people");

        var rm = document.createElement("button");
        rm.className = "remove";
        rm.textContent = "×";
        rm.title = "remove";
        rm.addEventListener("click", function () { wrap.remove(); });

        row.appendChild(caret);
        row.appendChild(inst);
        row.appendChild(who);
        row.appendChild(rm);
        wrap.appendChild(row);

        if (isGroup) {
          var kids = document.createElement("div");
          kids.className = "children";
          (node.children || []).forEach(function (c) { renderNode(c, kids, depth + 1); });
          wrap.appendChild(kids);

          var expanded = !!node.expanded;
          var apply = function () {
            caret.textContent = expanded ? "▾" : "▸";
            kids.style.display = expanded ? "" : "none";
            who.style.display = expanded ? "none" : ""; // collapsed = credit the whole group
            wrap.dataset.expanded = expanded ? "1" : "0";
          };
          apply();
          caret.addEventListener("click", function () { expanded = !expanded; apply(); });
        }

        container.appendChild(wrap);
      }

      (prefill.tree || []).forEach(function (n) { renderNode(n, rowsEl, 0); });
      if (!(prefill.tree || []).length) {
        renderNode({ kind: "audio", instrument: "", performerName: "", expanded: false }, rowsEl, 0);
      }

      // "+ add a part" adds a free top-level leaf row (escape hatch for a player
      // not represented by any track).
      document.getElementById("add").addEventListener("click", function () {
        renderNode({ kind: "audio", instrument: "", performerName: "", expanded: false }, rowsEl, 0);
      });

      // Dumb DOM → tree-state collector (no frontier rule here; TS applies it).
      function collect(container) {
        var out = [];
        for (var i = 0; i < container.children.length; i++) {
          var wrap = container.children[i];
          if (!wrap.classList || !wrap.classList.contains("node")) continue;
          var row = wrap.querySelector(":scope > .credit-row");
          var inst = row.querySelector(".instrument").value.trim();
          var who = row.querySelector(".who").value.trim();
          if (wrap.dataset.kind === "group") {
            var kids = wrap.querySelector(":scope > .children");
            out.push({
              instrument: inst, performerName: who, kind: "group",
              expanded: wrap.dataset.expanded === "1",
              children: collect(kids),
            });
          } else {
            out.push({ instrument: inst, performerName: who, kind: wrap.dataset.kind });
          }
        }
        return out;
      }

      function post(resultObj) {
        var msg = { method: "close_and_send", params: [JSON.stringify(resultObj)] };
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live) {
          window.webkit.messageHandlers.live.postMessage(msg); // macOS
        } else if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(msg); // Windows
        }
      }

      document.getElementById("skip").addEventListener("click", function () { post({ cancelled: true }); });
      document.getElementById("save").addEventListener("click", function () {
        post({ cancelled: false, tree: collect(rowsEl) });
      });
    </script>
  </body>
</html>
