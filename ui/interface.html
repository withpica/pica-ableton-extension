<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div class="h">register this set in pica</div>
    <!--
      ADR-259: which catalogue this registration lands in. Hidden until the
      host supplies it, so an older build that injects no destination renders
      exactly as before rather than showing an empty row.
    -->
    <div class="kv" id="acct" style="display: none">
      <span class="k">account</span><span class="v" id="acctv"></span>
    </div>
    <div class="hint" id="summary"></div>

    <div class="label">title *</div>
    <input id="title" class="input" autocomplete="off" placeholder="name this work" />

    <div class="label">artist name *</div>
    <input id="artist" class="input" autocomplete="off" placeholder="primary artist" list="people" />
    <datalist id="people"></datalist>

    <div class="row">
      <div>
        <div class="label">work type</div>
        <select id="workType" class="select">
          <option value="song">song</option>
          <option value="instrumental">instrumental</option>
          <option value="library">library</option>
          <option value="demo">demo</option>
          <option value="sample">sample</option>
        </select>
      </div>
      <div>
        <div class="label">key</div>
        <input id="key" class="input" autocomplete="off" />
      </div>
    </div>

    <div class="hint" id="err" style="color:#f87171;min-height:14px;margin-top:8px"></div>
    <div class="actions">
      <button id="cancel">cancel</button>
      <button id="register" class="primary">register</button>
    </div>

    <script>
      // The host injects the prefill object as the URL hash (set by extension.ts).
      // Shape: { summary, key, workType }.
      var prefill = window.__PICA_PREFILL__ || {};
      if (!window.__PICA_PREFILL__) {
        try { prefill = JSON.parse(decodeURIComponent(location.hash.slice(1) || "")) || {}; } catch (e) {}
      }

      document.getElementById("summary").textContent = prefill.summary || "";

      // The connected account, injected as window.__PICA_DESTINATION__.
      var destination = window.__PICA_DESTINATION__ || prefill.destination || "";
      if (destination) {
        document.getElementById("acctv").textContent = destination;
        document.getElementById("acct").style.display = "flex";
      }
      if (prefill.key) document.getElementById("key").value = prefill.key;
      if (prefill.workType) document.getElementById("workType").value = prefill.workType;

      var peopleNames = window.__PICA_PEOPLE_NAMES__ || [];
      var dl = document.getElementById("people");
      if (dl) peopleNames.forEach(function (n) { var o = document.createElement("option"); o.value = n; dl.appendChild(o); });

      function post(resultObj) {
        var msg = { method: "close_and_send", params: [JSON.stringify(resultObj)] };
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live) {
          window.webkit.messageHandlers.live.postMessage(msg); // macOS
        } else if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(msg); // Windows
        }
      }

      document.getElementById("cancel").addEventListener("click", function () {
        post({ cancelled: true });
      });

      document.getElementById("register").addEventListener("click", function () {
        var title = document.getElementById("title").value.trim();
        var artist = document.getElementById("artist").value.trim();
        var err = document.getElementById("err");
        if (!title || !artist) {
          err.textContent = "title and artist name are required";
          return;
        }
        post({
          cancelled: false,
          title: title,
          artistName: artist,
          workType: document.getElementById("workType").value,
          key: document.getElementById("key").value.trim(),
        });
      });
    </script>
  </body>
</html>
